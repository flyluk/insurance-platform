# Shared env for Kafka (read via insurance_shared.events helpers)
x-kafka-env: &kafka_env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_DOMAIN_EVENTS_TOPIC: insurance.domain.events
  KAFKA_DOMAIN_EVENTS_DLQ_TOPIC: insurance.domain.events.dlq
  KAFKA_HANDLER_MAX_RETRIES: "15"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: insurancepass
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  new-business:
    build:
      context: .
      dockerfile: services/new-business/Dockerfile
    environment:
      <<: *kafka_env
      JWT_SECRET: local-dev-secret-change-me
      UVICORN_WORKERS: "1"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "8"
      DATABASE_URL: postgresql://insurance:insurancepass@postgres:5432/nb_db
      PRODUCT_ENGINE_URL: http://product-engine:8000
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product-engine:
        condition: service_started

  underwriting:
    build:
      context: .
      dockerfile: services/underwriting/Dockerfile
    environment:
      <<: *kafka_env
      JWT_SECRET: local-dev-secret-change-me
      UVICORN_WORKERS: "1"
      DATABASE_URL: postgresql://insurance:insurancepass@postgres:5432/uw_db
      PRODUCT_ENGINE_URL: http://product-engine:8000
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product-engine:
        condition: service_started

  policy-admin:
    build:
      context: .
      dockerfile: services/policy-admin/Dockerfile
    environment:
      <<: *kafka_env
      JWT_SECRET: local-dev-secret-change-me
      UVICORN_WORKERS: "1"
      DATABASE_URL: postgresql://insurance:insurancepass@postgres:5432/policy_db
      PRODUCT_ENGINE_URL: http://product-engine:8000
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product-engine:
        condition: service_started

  claims:
    build:
      context: .
      dockerfile: services/claims/Dockerfile
    environment:
      <<: *kafka_env
      JWT_SECRET: local-dev-secret-change-me
      UVICORN_WORKERS: "1"
      DATABASE_URL: postgresql://insurance:insurancepass@postgres:5432/claims_db
      POLICY_ADMIN_URL: http://policy-admin:8000
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      policy-admin:
        condition: service_started

  finance:
    build:
      context: .
      dockerfile: services/finance/Dockerfile
    environment:
      <<: *kafka_env
      JWT_SECRET: local-dev-secret-change-me
      UVICORN_WORKERS: "1"
      DATABASE_URL: postgresql://insurance:insurancepass@postgres:5432/finance_db
    ports:
      - "8005:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  product-engine:
    build:
      context: .
      dockerfile: services/product-engine/Dockerfile
    environment:
      JWT_SECRET: local-dev-secret-change-me
      UVICORN_WORKERS: "1"
      DATABASE_URL: postgresql://insurance:insurancepass@postgres:5432/product_db
    ports:
      - "8006:8000"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      JWT_SECRET: local-dev-secret-change-me
      UVICORN_WORKERS: "1"
      DATABASE_URL: postgresql://insurance:insurancepass@postgres:5432/identity_db
      NEW_BUSINESS_URL: http://new-business:8000
      UNDERWRITING_URL: http://underwriting:8000
      POLICY_ADMIN_URL: http://policy-admin:8000
      CLAIMS_URL: http://claims:8000
      FINANCE_URL: http://finance:8000
      PRODUCT_ENGINE_URL: http://product-engine:8000
    ports:
      - "8090:8000"
    depends_on:
      - new-business
      - underwriting
      - policy-admin
      - claims
      - finance
      - product-engine

  web:
    build:
      context: ./frontend
    ports:
      - "8088:80"
    depends_on:
      - gateway

  product-portal:
    build:
      context: ./product-portal
    ports:
      - "8089:80"
    depends_on:
      - gateway

  policyholder-portal:
    build:
      context: ./policyholder-portal
    ports:
      - "8091:80"
    depends_on:
      - gateway

volumes:
  postgres_data:
