apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-kafka
  namespace: insurance
  labels:
    app: insurance-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insurance-kafka
  template:
    metadata:
      labels:
        app: insurance-kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: plaintext
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://insurance-kafka.insurance.svc.cluster.local:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: insurance-kafka
  namespace: insurance
  labels:
    app: insurance-kafka
spec:
  selector:
    app: insurance-kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
---
apiVersion: batch/v1
kind: Job
metadata:
  name: insurance-kafka-topic-init
  namespace: insurance
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topic-init
          image: apache/kafka:3.8.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              BOOTSTRAP="insurance-kafka.insurance.svc.cluster.local:9092"
              echo "Waiting for Kafka at ${BOOTSTRAP}..."
              for i in $(seq 1 60); do
                if /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${BOOTSTRAP}" --list >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server "${BOOTSTRAP}" \
                --create \
                --if-not-exists \
                --topic insurance.domain.events \
                --partitions 3 \
                --replication-factor 1
              echo "Topic insurance.domain.events ready"
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${BOOTSTRAP}" --list
