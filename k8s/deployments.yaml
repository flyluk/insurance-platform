apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-business
  namespace: insurance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: new-business
  template:
    metadata:
      labels:
        app: new-business
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: insurance-new-business:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: insurance-secrets
                  key: NB_DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: insurance-secrets
                  key: JWT_SECRET
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: insurance-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_DOMAIN_EVENTS_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: insurance-config
                  key: KAFKA_DOMAIN_EVENTS_TOPIC
            - name: KAFKA_DOMAIN_EVENTS_DLQ_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: insurance-config
                  key: KAFKA_DOMAIN_EVENTS_DLQ_TOPIC
            - name: KAFKA_HANDLER_MAX_RETRIES
              valueFrom:
                configMapKeyRef:
                  name: insurance-config
                  key: KAFKA_HANDLER_MAX_RETRIES
            - name: PRODUCT_ENGINE_URL
              valueFrom:
                configMapKeyRef:
                  name: insurance-config
                  key: PRODUCT_ENGINE_URL
            - name: UVICORN_WORKERS
              valueFrom:
                configMapKeyRef:
                  name: insurance-config
                  key: UVICORN_WORKERS
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: new-business
  namespace: insurance
  labels:
    app: new-business
spec:
  selector:
    app: new-business
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
