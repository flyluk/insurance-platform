apiVersion: v1
kind: ConfigMap
metadata:
  name: insurance-platform-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  insurance-platform.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "title": "HTTP request rate by service",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (service) (rate(http_requests_total[5m]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "title": "HTTP latency p95 by service",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "title": "HTTP errors (5xx) by service",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (service) (rate(http_requests_total{status=~\"5..\"}[5m]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "title": "Domain events produced/consumed",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (event_type, direction, service) (rate(insurance_domain_events_total[5m]))",
              "legendFormat": "{{service}} {{direction}} {{event_type}}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["insurance"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "title": "Insurance Platform",
      "uid": "insurance-platform",
      "version": 1
    }
