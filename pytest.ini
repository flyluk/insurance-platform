[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    api: API tests against the gateway
    e2e: end-to-end API flows (Kafka async)
    ui: Playwright UI tests
    zephyr(key): Zephyr Scale test case key (e.g. INS-T12)
    story(key): Jira story key for Zephyr coverage (e.g. INS-123)
testpaths = tests
pythonpath = tests
filterwarnings =
    ignore::DeprecationWarning
